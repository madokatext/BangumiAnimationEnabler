name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Check out libxposed API 100
        uses: actions/checkout@v4
        with:
          repository: libxposed/api
          ref: e2588ee24bbef12c7c2e07666efa60e58e1ee6b3
          path: .build-deps/libxposed-api

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDKs
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0" "platforms;android-35" "build-tools;35.0.0"

      - name: Publish libxposed API 100 locally
        run: |
          chmod +x .build-deps/libxposed-api/gradlew
          .build-deps/libxposed-api/gradlew \
            -p .build-deps/libxposed-api \
            :api:publishApiPublicationToMavenLocal \
            --stacktrace

      - name: Build signed release APK
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: BangumiAnimationEnabler-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
